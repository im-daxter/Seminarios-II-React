<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avaliador de filmes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Avaliador de Filmes</h1>
    <p id="resumo">0 de 3 avaliados</p>

    <main class="lista">
        <article class="filme">
            <h2>Indiana Jones</h2>
            <p>1973</p>
            <input type="range" min="1" max="5" />
            <p class="nota">Sem nota</p>
        </article>

        <article class="filme">
            <h2>De Volta Para o Futuro</h2>
            <p>1984</p>
            <input type="range" min="1" max="5" />
            <p class="nota">Sem nota</p>
        </article>

        <article class="filme">
            <h2>Pulp Fiction</h2>
            <p>1994</p>
            <input type="range" min="1" max="5" />
            <p class="nota">Sem nota</p>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
